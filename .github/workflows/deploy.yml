name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/fortress
  NODE_VERSION: "20"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd ${{ env.DEPLOY_PATH }}

            echo ">>> Pulling latest code..."
            git pull origin main

            echo ">>> Installing dependencies..."
            npm ci --production=false

            echo ">>> Building..."
            npm run build

            echo ">>> Restarting app..."
            pm2 restart fortress || pm2 start npm --name fortress -- start

            echo ">>> Deploy complete!"
